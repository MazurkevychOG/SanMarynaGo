name: Перевірка каталогу

# Запускається при кожному пуші та Pull Request: перевіряє схему, id, порядок, типи, країни, аліаси,
# користувачів, наявність фото і що data/index.json та data/users/index.json актуальні.
on:
  push:
    branches: [main]
    paths: ['data/**', 'schema/**', 'scripts/**', 'package*.json', '.github/workflows/validate.yml']
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check

